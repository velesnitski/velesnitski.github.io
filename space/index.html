<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✦ space.</title>
<meta name="description" content="somewhere out here — a strawberry.">
<meta name="theme-color" content="#05070d">
<link rel="shortcut icon" type="image/x-icon" href="../favicons/favicon.ico">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05070d;color:#dfe6f4;
    font-family:system-ui,-apple-system,sans-serif}
  .neb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.16;pointer-events:none}
  #n1{width:60vmax;height:44vmax;left:-18vmax;top:-14vmax;background:radial-gradient(circle,#31456e,transparent 70%)}
  #n2{width:52vmax;height:40vmax;right:-16vmax;bottom:-12vmax;background:radial-gradient(circle,#5e2b3a,transparent 70%)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c.grabbing{cursor:grabbing}
  #card{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:3;text-align:center;
    pointer-events:none;transition:opacity 1.4s}
  #card h1{font-size:26px;font-weight:800;letter-spacing:.06em}
  #card p{font-size:12px;color:#8a94ad;margin-top:3px}
  #card.dim{opacity:.35}
  #more{position:fixed;right:18px;bottom:13px;z-index:6;color:#5a6478;font-weight:800;font-size:15px;
        cursor:pointer;user-select:none;text-decoration:underline}
  #more:hover{color:#a9b6d6}
  #pop{position:fixed;right:16px;bottom:44px;z-index:6;background:rgba(8,11,20,.96);border:1px solid #26314e;
       border-radius:12px;padding:13px 17px;font-size:12px;line-height:1.9;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #pop.show{display:block}
  #pop a{color:#9fb4e8}
</style>
</head>
<body>
  <div class="neb" id="n1"></div><div class="neb" id="n2"></div>
  <canvas id="c"></canvas>
  <div id="card"><h1>space.</h1><p>somewhere out here &mdash; a strawberry.<br>drag &mdash; turn &middot; tap &mdash; let go</p></div>
  <div id="more">???</div>
  <div id="pop">
    <b>space.</b> &middot; twelve thousand specks of dust<br>
    the dino runs at <a href="../dino/">🍓 Strawberry Dash</a><br>
    the rocket wobbles at <a href="../rocket/">🚀 rocket jump</a><br>
    the fish swim at <a href="../fish/">🐟 fish.</a><br>
    the village sleeps at <a href="../ascii/">▚ ascii village.</a><br>
    <span style="color:#4a5570">by velesnitski &middot; three.js &middot; space v1</span>
  </div>
<script src="../rocket/three.min.js"></script>
<script>
addEventListener('error',e=>{ document.title='ERR: '+e.message; });
const TELEMETRY_EP='https://script.google.com/macros/s/AKfycbyA-zpBfGubbXMPGJNe5_nRhcAWUt19uE_nln2oCbH4XGjnwkT6qjC1cNEWrlpQXnqf/exec';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

const N = REDUCED? 4000 : 12000;
const DUST = Math.floor(N*.3);                 // stardust that never settles
const BERRY = N-DUST;

/* ── sample the strawberry (object space, unit-ish scale) ── */
const tgt=new Float32Array(N*3), col=new Float32Array(N*3), seed=new Float32Array(N),
      flow=new Float32Array(N*3), kind=new Float32Array(N);
function setC(i,hex,jit){ const c=new THREE.Color(hex);
  col[i*3]=c.r*(1-jit/2+Math.random()*jit); col[i*3+1]=c.g*(1-jit/2+Math.random()*jit); col[i*3+2]=c.b*(1-jit/2+Math.random()*jit); }
let i=0;
const LEAF=Math.floor(BERRY*.16), BODY=BERRY-LEAF;
for(let k=0;k<BODY;k++,i++){
  // fibonacci sphere → berry profile: broad shoulders, pinched tip
  const t=(k+.5)/BODY, y=1-2*t, r=Math.sqrt(Math.max(0,1-y*y)), phi=k*2.399963;
  let s=r*(0.98+0.16*y);                       // wider up top
  if(y<-.45) s*=Math.max(.25, 1+(y+.45)*.9);   // taper to the tip
  const px=Math.cos(phi)*s, pz=Math.sin(phi)*s, py=y*1.18-.06;
  tgt[i*3]=px; tgt[i*3+1]=py; tgt[i*3+2]=pz;
  if(Math.random()<.085){ setC(i,'#ffdf8a',.15); tgt[i*3]*=1.03; tgt[i*3+2]*=1.03; } // seeds
  else setC(i, Math.random()<.5?'#ff4d63':'#d92a44', .25);
  kind[i]=0;
}
for(let k=0;k<LEAF;k++,i++){
  const blade=k%6, a=blade/6*Math.PI*2+.35, t=Math.random();
  const u=.12+t*.62, w=(Math.random()-.5)*.34*(1-t);
  const px=Math.cos(a)*u - Math.sin(a)*w, pz=Math.sin(a)*u + Math.cos(a)*w;
  const py=1.02 + .16*Math.sin(t*Math.PI) - .3*t*t;
  tgt[i*3]=px; tgt[i*3+1]=py; tgt[i*3+2]=pz;
  setC(i, Math.random()<.8?'#46c274':'#2e9455', .25); kind[i]=0;
}
for(let k=0;k<DUST;k++,i++){
  tgt[i*3]=0; tgt[i*3+1]=0; tgt[i*3+2]=0; kind[i]=1;
  const r=Math.random();
  setC(i, r<.72?'#cdd6f2': r<.86?'#7ab1fe':'#f8a15c', .3);
}
for(let k=0;k<N;k++){ seed[k]=Math.random();
  flow[k*3]=Math.random()*Math.PI*2;           // theta0
  flow[k*3+1]=.9+Math.random()*2.4;            // r0
  flow[k*3+2]=(Math.random()-.5)*1.6; }        // y0

/* ── scene: one Points, all motion in the vertex shader ── */
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false,alpha:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,1,.1,50); cam.position.z=3.4;
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3)); // unused, shader-driven
geo.setAttribute('aTarget',new THREE.BufferAttribute(tgt,3));
geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
geo.setAttribute('aFlow',new THREE.BufferAttribute(flow,3));
geo.setAttribute('aKind',new THREE.BufferAttribute(kind,1));
const uni={ uTime:{value:0}, uA:{value:0}, uBurst:{value:0}, uRotY:{value:0}, uRotX:{value:0}, uPx:{value:1} };
const mat=new THREE.ShaderMaterial({ uniforms:uni, transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute vec3 aTarget; attribute vec3 aColor; attribute vec3 aFlow;
    attribute float aSeed; attribute float aKind;
    uniform float uTime,uA,uBurst,uRotY,uRotX,uPx;
    varying vec3 vColor; varying float vTw;
    void main(){
      float sp=.22+aSeed*.25;
      float th=aFlow.x+uTime*(.10+.14*fract(aSeed*7.3));
      float rr=.55+mod(aFlow.y-uTime*sp, 2.9);                    // spiral, drifting inward
      float yy=(aFlow.z+sin(uTime*.4+aSeed*6.28)*.18)*(.25+rr*.28);
      vec3 fp=vec3(cos(th)*rr, yy, sin(th)*rr);
      float a=(1.-aKind)*smoothstep(aSeed*.6, aSeed*.6+.55, uA*1.55);
      vec3 p=mix(fp,aTarget,a);
      p+=normalize(aTarget+vec3(.001))*uBurst*(.35+.75*fract(aSeed*3.7));
      float cy=cos(uRotY),sy=sin(uRotY),cx=cos(uRotX),sx=sin(uRotX);
      p=vec3(p.x*cy+p.z*sy, p.y, -p.x*sy+p.z*cy);
      p=vec3(p.x, p.y*cx-p.z*sx, p.y*sx+p.z*cx);
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_Position=projectionMatrix*mv;
      float sz=mix(1.1+2.6*fract(aSeed*5.1), 2.0+2.2*fract(aSeed*5.1), a);
      gl_PointSize=sz*uPx*(3.4/-mv.z)*(1.-.35*aKind);
      vColor=aColor; vTw=.65+.35*sin(uTime*(1.5+aSeed*2.)+aSeed*40.);
    }`,
  fragmentShader:`
    precision mediump float; varying vec3 vColor; varying float vTw;
    void main(){
      vec2 q=gl_PointCoord-.5; float d=length(q);
      float al=smoothstep(.5,.08,d)*vTw;
      gl_FragColor=vec4(vColor*al,al);
    }`});
scene.add(new THREE.Points(geo,mat));
function resize(){ const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  cam.position.z=(w/h<1)?4.6:3.4; uni.uPx.value=Math.min(2,devicePixelRatio||1)*Math.min(1,h/650)*2.1; }
addEventListener('resize',resize); resize();

/* ── the one mechanic: assemble ⇄ let go; drag/arrows to turn ── */
let A=0, targetA=1, burst=0, rotY=0, rotX=0, velY=REDUCED?0:.12, velX=0, holdT=0;
const card=document.getElementById('card');
function vibe(ms){ try{ navigator.vibrate&&navigator.vibrate(ms); }catch(e){} }
function letGo(){ targetA=0; holdT=1.1; burst=1; vibe(12); card.classList.add('dim'); }
let pd=null, dragged=false;
const cv=document.getElementById('c');
addEventListener('pointerdown',e=>{ pd={x:e.clientX,y:e.clientY,t:performance.now()}; dragged=false; cv.classList.add('grabbing'); },{passive:true});
addEventListener('pointermove',e=>{ if(!pd) return;
  const dx=e.clientX-pd.x, dy=e.clientY-pd.y;
  if(Math.abs(dx)+Math.abs(dy)>8) dragged=true;
  if(dragged){ velY+=dx*.0004; velX+=dy*.0003; pd.x=e.clientX; pd.y=e.clientY; } },{passive:true});
addEventListener('pointerup',e=>{ cv.classList.remove('grabbing');
  if(pd&&!dragged&&performance.now()-pd.t<350) letGo(); pd=null; },{passive:true});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') velY-=.03; else if(e.key==='ArrowRight') velY+=.03;
  else if(e.key==='ArrowUp') velX-=.02; else if(e.key==='ArrowDown') velX+=.02;
  else if(e.key===' '){ e.preventDefault(); letGo(); } });

let last=performance.now(), t0=last;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  uni.uTime.value=(now-t0)/1000;
  if(holdT>0){ holdT-=dt; if(holdT<=0){ targetA=1; card.classList.remove('dim'); } }
  A+=(targetA-A)*(targetA>A? .65 : 3.0)*dt; A=Math.max(0,Math.min(1,A));   // gather slowly, let go fast
  uni.uA.value=A;
  burst=Math.max(0,burst-dt*1.4); uni.uBurst.value=burst*burst;
  rotY+=(velY+(REDUCED?0:.05))*dt*3; rotX+=velX*dt*3;
  rotX=Math.max(-.7,Math.min(.7,rotX));
  velY*=Math.pow(.2,dt); velX*=Math.pow(.15,dt);
  uni.uRotY.value=rotY; uni.uRotX.value=rotX;
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
setTimeout(()=>{ targetA=1; },600);
requestAnimationFrame(frame);

const pop=document.getElementById('pop');
document.getElementById('more').addEventListener('click',()=>pop.classList.toggle('show'));

let sid='space'; try{ sid=localStorage.getItem('dinoSid')||'space'; }catch(e){}
try{ navigator.sendBeacon(TELEMETRY_EP, JSON.stringify({ev:'space', v:56, sid,
  ua:navigator.userAgent.slice(0,180), lang:navigator.language||'',
  tz:(Intl.DateTimeFormat().resolvedOptions().timeZone||''), scr:screen.width+'x'+screen.height})); }catch(e){}
</script>
</body>
</html>
